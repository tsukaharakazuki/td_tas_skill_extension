  :root {
    /* Brand palette: HEX values from Treasure AI Brand Guidelines 2026 v0.1 (p.11) */
    --tas-primary-1: #494FFF;
    --tas-primary-2: #8753FF;
    --tas-secondary-1: #847BF2;
    --tas-secondary-2: #C466D4;
    --tas-accent-1: #9DCC4C;
    --tas-accent-2: #D9E47C;
    --tas-accent-3: #EE2328;
    --tas-accent-4: #F15C60;
    --tas-accent-5: #F69068;
    --tas-neutral-1: #FFFFFF;
    --tas-neutral-2: #000000;
    /* Derived tints built from the palette (the guide does not define these) */
    --tas-surface: rgba(73, 79, 255, 0.06);
    --tas-muted: rgba(0, 0, 0, 0.64);
    --tas-border: rgba(0, 0, 0, 0.12);
    --tas-font-display: "Manrope", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
    --tas-font-body: "Inter", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--tas-neutral-1); color: var(--tas-neutral-2); font-family: var(--tas-font-body); font-size: 15px; line-height: 1.6; text-align: left; }
  .tas-header { display: flex; align-items: center; padding: 24px 40px; border-bottom: 1px solid var(--tas-border); }
  .tas-logo { width: 200px; height: auto; display: block; }
  .tas-main { max-width: 1120px; margin: 0 auto; padding: 40px; }
  .tas-page-title { font-family: var(--tas-font-display); font-weight: 700; font-size: 40px; line-height: 1.15; margin: 0 0 8px; }
  .tas-lead { color: var(--tas-muted); margin: 0 0 32px; max-width: 720px; }
  .tas-section-title { font-family: var(--tas-font-display); font-weight: 700; font-size: 24px; line-height: 1.25; margin: 40px 0 16px; }
  .tas-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .tas-kpi { background: var(--tas-surface); border-radius: 12px; padding: 20px; }
  .tas-kpi-label { font-weight: 600; font-size: 13px; color: var(--tas-muted); }
  .tas-kpi-value { font-family: var(--tas-font-display); font-weight: 700; font-size: 32px; line-height: 1.1; color: var(--tas-primary-1); margin-top: 6px; }
  .tas-kpi-note { font-size: 13px; margin-top: 6px; }
  .tas-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tas-table th { background: var(--tas-primary-1); color: var(--tas-neutral-1); font-weight: 700; text-align: left; padding: 10px 12px; }
  .tas-table td { padding: 10px 12px; border-bottom: 1px solid var(--tas-border); }
  .tas-table .tas-num { text-align: right; font-variant-numeric: tabular-nums; }
  .tas-bars { display: grid; gap: 10px; }
  .tas-bar-row { display: grid; grid-template-columns: 140px 1fr 72px; align-items: center; gap: 12px; font-size: 14px; }
  .tas-bar-track { background: var(--tas-surface); border-radius: 6px; height: 16px; overflow: hidden; }
  .tas-bar-fill { height: 100%; border-radius: 6px; }
  .tas-callout { border-left: 4px solid var(--tas-primary-2); padding: 12px 20px; margin: 32px 0; font-style: italic; font-size: 17px; line-height: 1.35; }
  .tas-footer { display: flex; justify-content: space-between; padding: 20px 40px; border-top: 1px solid var(--tas-border); font-size: 12px; color: var(--tas-muted); }
  @media (max-width: 640px) {
    .tas-header { padding: 16px; }
    .tas-main { padding: 24px 16px; }
    .tas-page-title { font-size: 30px; }
    .tas-bar-row { grid-template-columns: 96px 1fr 56px; }
  }
</style>
